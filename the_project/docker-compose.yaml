services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo-app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_frontend
    command: /app/project frontend
    depends_on:
      - postgres
    environment:
      PORT: 8080

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go_backend
    command: /app/project backend
    environment:
      PORT: 9090
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/todo-app?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.20.1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: